<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Life180</title>
  
  <link rel="icon" href="favicon.png" type="image/png">
  
  <!-- Prevent caching -->
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Last-Modified" content="0">
  <meta http-equiv="Cache-Control" content="no-cache, mustrevalidate">
  <meta http-equiv="Pragma" content="no-cache">
  
  
  <!-- Styles -->

  <!-- Home Assistant theme bridge: when embedded in HA and same-origin with
       the parent, copy the parent theme's CSS variables onto :root so the app
       follows the user's HA theme (custom themes and dark mode included).
       Standalone / cross-origin: no-op, styles.css fallbacks apply. -->
  <script>
    (function () {
      var VARS = [
        "--primary-color", "--accent-color",
        "--primary-text-color", "--secondary-text-color", "--text-primary-color",
        "--primary-background-color", "--secondary-background-color",
        "--card-background-color", "--divider-color",
        "--error-color", "--warning-color", "--success-color",
        "--app-header-background-color", "--app-header-text-color",
        "--ha-card-border-radius", "--ha-card-box-shadow",
        "--mdc-typography-font-family", "--paper-font-body1_-_font-family"
      ];
      var root = document.documentElement;

      function parentDoc() {
        try {
          if (window.self === window.top) return null;
          var d = window.parent.document;         // throws if cross-origin
          return d && d.documentElement ? d : null;
        } catch (e) { return null; }
      }

      function apply() {
        var pdoc = parentDoc();
        if (!pdoc) return;
        try {
          var cs = window.parent.getComputedStyle(pdoc.documentElement);
          for (var i = 0; i < VARS.length; i++) {
            var v = cs.getPropertyValue(VARS[i]);
            if (v && v.trim()) root.style.setProperty(VARS[i], v.trim());
            else root.style.removeProperty(VARS[i]);
          }
          var scheme = cs.getPropertyValue("color-scheme").trim();
          if (scheme) root.style.setProperty("color-scheme", scheme);
          // Dark heuristic when the theme doesn't set color-scheme
          var bg = cs.getPropertyValue("--primary-background-color").trim()
                || cs.backgroundColor || "";
          var m = bg.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
          if (m) {
            var lum = (0.299 * +m[1] + 0.587 * +m[2] + 0.114 * +m[3]);
            root.setAttribute("data-ha-dark", lum < 128 ? "1" : "0");
          }
        } catch (e) { /* cross-origin race: ignore */ }
      }

      // The panel/card also pushes the theme in via postMessage, for the
      // setups where our window.parent is a bare wrapper we can't read.
      function applyRelayed(data) {
        try {
          var vars = data && data.vars;
          if (vars) {
            for (var k in vars) {
              if (vars[k]) root.style.setProperty(k, String(vars[k]).trim());
            }
          }
          if (typeof data.dark === "boolean") {
            root.setAttribute("data-ha-dark", data.dark ? "1" : "0");
          }
        } catch (e) { /* ignore */ }
      }
      window.addEventListener("message", function (ev) {
        if (ev && ev.data && ev.data.type === "life180-theme") applyRelayed(ev.data);
      });
      function requestRelay() {
        try {
          if (window.self !== window.top) {
            window.parent.postMessage({ type: "life180-request-theme" }, "*");
          }
        } catch (e) {}
      }

      apply();
      requestRelay();
      document.addEventListener("DOMContentLoaded", function () { apply(); requestRelay(); });
      window.addEventListener("load", function () { apply(); requestRelay(); });
      try {
        window.parent.addEventListener("ha-theme-changed", apply);
        var pdoc = parentDoc();
        if (pdoc && window.MutationObserver) {
          new MutationObserver(apply).observe(pdoc.documentElement, {
            attributes: true, attributeFilter: ["style", "class"]
          });
        }
      } catch (e) { /* ignore */ }
      // A few delayed passes for slow parent theme application
      [150, 500, 1500].forEach(function (t) { setTimeout(function () { apply(); requestRelay(); }, t); });
    })();
  </script>


</head>
<body hidden>
  <div id="container">
    <div id="map">
    </div>
    <div id="forms-container">
		<div id="combo-container">

				<th style="width: 15px;" data-i18n="percentage">%</th>
              </tr>				  
            </thead>
            <tbody id="persons-table-body">
              <!-- rows generated dynamically -->
            </tbody>
          </table>
        </div>
      </div> 	
      <div id="zones-container" style="display: none;"> <!-- hidden by default -->
        <div class="zone-actions" id="zone-actions" style="display: none;">
          <button id="add-zone-button" class="action-button btn-add" data-i18n="add">Add</button>
          <button id="edit-zone-button" class="action-button btn-edit" data-i18n="edit">Edit</button>		  
          <button id="delete-zone-button" class="action-button btn-delete" data-i18n="delete">Delete</button>
        </div>
        <div class="table-container">
          <table  id="zones-table" class="fixed-table">
            <thead>
              <tr>
                <th style="width: 33px;" data-i18n="column_map">Mapa</th>
				<th style="width: 33px;" data-i18n="column_type">Type</th>					
                <th data-i18n="name">Name</th>
				<th style="width: 33px;" data-i18n="radius">Radius</th>

            <tbody id="zones-table-body">

            </div>

                    <tr>

                    </tr>
                    <tr>

                      <td id="total-time">--</td>
                    </tr>
                    <tr>
                      <td data-i18n="distance">Distance</td>
                      <td id="distance">--</td>
                    </tr>

                      <td id="max-speed">--</td>
                    </tr>
                    <tr>

                      <td id="average-speed">--</td>
                    </tr>

                      <td id="stops-count">--</td>

                </table>

            </div>
		    <div id="chart" class="tab">

    <button class="hamburger-button" id="hamburger-button" aria-label="Toggle sidebar">&gt;&gt;&gt;</button>
  </div>

  <!-- Script loading -->
  
  <!-- Load Life180 CSS and JS -->
  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const v = urlParams.get("v") ?? Date.now(); // fallback "cache buster" when no v is present
    const debugParam = urlParams.get("debug");
    const isDebug = debugParam !== null && debugParam !== "0" && String(debugParam).toLowerCase() !== "false";

    function loadCSS(href) {
      return new Promise((resolve, reject) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href + (href.includes('?') ? '&' : '?') + 'v=' + v;
        link.onload = () => resolve();
        link.onerror = () => reject(new Error('CSS not loaded: ' + link.href));
        document.head.appendChild(link);
      });
    }

    (async () => {
      try {
        // 1) Load the app CSS (avoids FOUC)
        await loadCSS('css/styles.css');

        // 2) Let the layout settle
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        // 3) Import the bundle according to the mode
        const entry = isDebug ? './js/main.js' : './dist/life180.js';
        const url = new URL(`${entry}${entry.includes('?') ? '&' : '?'}v=${v}`, import.meta.url).href;
        await import(url);

        // 4) Show the body and dispatch events if applicable
        document.body.removeAttribute('hidden');
        const domReady = document.readyState !== 'loading';
        const winLoaded = document.readyState === 'complete';
        if (domReady) document.dispatchEvent(new Event('DOMContentLoaded'));
        if (winLoaded) window.dispatchEvent(new Event('load'));
      } catch (e) {
        console.error('[loader] error', e);
        // Fallback: do not stay blank if the CSS or the import fails
        document.body.removeAttribute('hidden');
        document.body.style.visibility = 'visible';
        document.body.style.opacity = '1';
      }
    })();
  </script>
</body>
</html>
