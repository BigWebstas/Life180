blueprint:
  name: Not Home By Alert (Life180)
  description: "
    Send voice, push or Telegram notifications at a set time if any
    selected person is not in the chosen zone yet (for example, nobody home by 9 pm).
    "
  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:
    person_entities:
      name: Persons
      description: Select one or more persons
      selector:
        entity:
          domain: person
          multiple: true

    zone_entity:
      name: Zone
      description: The zone they should be in by the deadline
      default: zone.home
      selector:
        entity:
          domain: zone

    deadline:
      name: Deadline
      description: Time of day to check
      default: "21:00:00"
      selector:
        time: {}

    weekdays:
      name: Days
      description: Only check on these days
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          mode: list
          options:
            - { label: Monday, value: mon }
            - { label: Tuesday, value: tue }
            - { label: Wednesday, value: wed }
            - { label: Thursday, value: thu }
            - { label: Friday, value: fri }
            - { label: Saturday, value: sat }
            - { label: Sunday, value: sun }

    message:
      name: Message
      description: Use {person} and {zone}
      default: "{person} isn't in {zone} yet"

    tts_devices:
      name: TTS devices (HA Companion)
      description: Phones/tablets that should SPEAK the message (Companion App TTS)
      default: []
      selector:
        device:
          integration: mobile_app
          multiple: true

    push_devices:
      name: Push-only devices (HA Companion)
      description: Devices that should receive a normal push notification
      default: []
      selector:
        device:
          integration: mobile_app
          multiple: true

    telegram_targets:
      name: Telegram chats
      description: Telegram notify entities (from the Telegram bot integration) that should receive the message
      default: []
      selector:
        entity:
          domain: notify
          multiple: true

# ---------- Automation ----------
trigger:
  - platform: time
    at: !input deadline

condition:
  - condition: time
    weekday: !input weekdays

variables:
  person_ids: !input person_entities
  zone_id: !input zone_entity
  message_tpl: !input message
  tts_devs: !input tts_devices
  push_devs: !input push_devices
  telegram_devs: !input telegram_targets

action:
  - variables:
      zone_label: "{{ state_attr(zone_id, 'friendly_name') or zone_id }}"
      # The zone entity lists the persons currently inside it
      zone_persons: "{{ state_attr(zone_id, 'persons') or [] }}"

      tts_services_list: >
        {% set ns = namespace(svcs=[]) %}
        {% for dev in tts_devs %}
          {% set ns.svcs = ns.svcs + [ 'notify.mobile_app_' ~ (device_attr(dev, 'name') | slugify) ] %}
        {% endfor %}
        {{ ns.svcs | unique | list }}

      push_services_list: >
        {% set ns = namespace(svcs=[]) %}
        {% for dev in push_devs %}
          {% set ns.svcs = ns.svcs + [ 'notify.mobile_app_' ~ (device_attr(dev, 'name') | slugify) ] %}
        {% endfor %}
        {{ ns.svcs | unique | list }}

  - repeat:
      for_each: "{{ person_ids }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ repeat.item not in zone_persons }}"
          then:
            - variables:
                msg: >
                  {{ message_tpl | string
                     | replace('{person}', state_attr(repeat.item, 'friendly_name') or repeat.item)
                     | replace('{zone}', zone_label) | trim }}
            - repeat:
                for_each: "{{ tts_services_list }}"
                sequence:
                  - service: "{{ repeat.item }}"
                    data:
                      message: "TTS"
                      data:
                        tts_text: "{{ msg }}"
                        priority: high
                        ttl: 0
            - repeat:
                for_each: "{{ push_services_list }}"
                sequence:
                  - service: "{{ repeat.item }}"
                    data:
                      message: "{{ msg }}"
                      data:
                        priority: high
                        ttl: 0
            - if: "{{ telegram_devs | length > 0 }}"
              then:
                - service: notify.send_message
                  target:
                    entity_id: "{{ telegram_devs }}"
                  data:
                    message: "{{ msg }}"

mode: parallel
max: 10
